import org.gradle.api.tasks.testing.logging.TestExceptionFormat

buildscript {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}

plugins {
    id 'java'
    id 'application'
    alias(coreLibs.plugins.shadow)
}

group = 'io.kaleido'

jar {
    destinationDirectory = layout.buildDirectory.dir('thin-libs')
}

// Set the main class for the JAR
shadowJar {
    manifest {
        attributes(
            'Main-Class': 'io.kaleido.paladin.Main'
        )
    }

    if (project.hasProperty('jarVersion')) {
        archiveVersion = project.jarVersion
    } else {
        archiveVersion = ''
    }

    archiveBaseName = 'paladin'  // Base name of the JAR, the version will be added to this
    archiveClassifier = ''

    mergeServiceFiles()
}

task wrapper(type: Wrapper){}

assemble.dependsOn shadowJar

application {
    mainClass.set('io.kaleido.paladin.Main')
    applicationDefaultJvmArgs = ["-Djna.library.path=" +
        file("${rootDir}/core/go/build/libs").absolutePath + ":" + file("${rootDir}/toolkit/go/build/libs").absolutePath ]
}

// run -PconfigFile=config.paladin.yaml -Pmode=node to override the default values
tasks.named('run') {
    // Check if 'configFile' and 'mode' properties are passed via the command line
    def configFile = project.hasProperty('configFile') ? project.getProperty('configFile') : 'config.paladin.yaml'
    def mode = project.hasProperty('mode') ? project.getProperty('mode') : 'testbed'

    // Pass these arguments to the Java application
    args = [configFile, mode]

    doFirst {
        println "Running with config file: $configFile and mode: $mode"
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

sourceSets {
    testPlugin
}

// A plugin jar whose contents conflict with core's test classpath, for tests of plugin class loading
def testPluginJar = tasks.register('testPluginJar', Jar) {
    from sourceSets.testPlugin.output
    archiveFileName = 'test-plugin.jar'
    destinationDirectory = layout.buildDirectory.dir('test-plugin')
}

test {
    dependsOn ':testinfra:startTestInfra'
    dependsOn testPluginJar
    systemProperty "paladin.testPluginJar", testPluginJar.get().archiveFile.get().asFile.absolutePath
    testLogging {
        showStandardStreams = true
        testLogging {
            events("passed", "skipped", "failed")
            showStackTraces = true
            exceptionFormat = TestExceptionFormat.FULL
        }
    }
    useJUnitPlatform()
    systemProperty "jna.library.path", file("${rootDir}/core/go/build/libs").absolutePath + ":" + file("${rootDir}/toolkit/go/build/libs").absolutePath
}

configurations {
    // Resolvable configurations
    toolkitProtoDefinitions {
        canBeConsumed = false
        canBeResolved = true
    }
    libcore {
        canBeConsumed = false
        canBeResolved = true
    }
    libstarter {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {

    implementation coreLibs.grpc.api
    implementation coreLibs.grpc.stub

    implementation coreLibs.bcprov
    implementation coreLibs.netty.all
    implementation coreLibs.jackson.dataformat.yaml

    implementation coreLibs.log4j.core

    toolkitProtoDefinitions project(path: ":toolkit:proto", configuration: "protoDefinitions")

    testImplementation project(path: ":core:go", configuration: "libcore")
    testImplementation project(path: ":toolkit:go", configuration: "libstarter")
    testImplementation project(path: ":solidity", configuration: "compiledContracts")

    implementation coreLibs.jna.platform
    implementation coreLibs.protobuf.java.util

    compileOnly coreLibs.tomcat.annotations.api

    testImplementation platform(coreLibs.junit.bom)
    testImplementation coreLibs.junit.jupiter
    testImplementation project(path: ':toolkit:go', configuration: 'libstarter')
    testImplementation coreLibs.jsonassert

    implementation project(path: ":toolkit_java")
} 
