task copyZetoZKPFiles(type: Copy) {
    def zetoZkpDir = file("${buildDir}/domains/zeto/zkp")

    // Every release tree this task reads is produced by that generation's extract task. Declared lazily via a closure
    // because the root script is configured before the :domains:zeto ext block exists; without it Gradle reports an
    // undeclared dependency on the producer as soon as both tasks are in the same build.
    dependsOn {
        project(':domains:zeto').ext.zetoVersions.collect { variant ->
            ":domains:zeto:extractZetoZkp_${variant.id}"
        }
    }

    doFirst {
        zetoZkpDir.mkdirs()
    }

    // These can be very large binaries, so adding to this list in the base image should be done with care.
    // Likely if the range of circuits grows, a separate docker tag will be required for builds
    // of Paladin that have a wider range of pre-built circuits included.
    def zetoCircuitIncludes = [
        // anon
        'anon.zkey',
        'anon-vkey.json',
        'anon_js/anon.wasm',
        'anon_batch.zkey',
        'anon_batch-vkey.json',
        'anon_batch_js/anon_batch.wasm',
        // anon_enc
        'anon_enc.zkey',
        'anon_enc-vkey.json',
        'anon_enc_js/anon_enc.wasm',
        'anon_enc_batch.zkey',
        'anon_enc_batch-vkey.json',
        'anon_enc_batch_js/anon_enc_batch.wasm',
        // anon_nullifier
        'anon_nullifier_transfer.zkey',
        'anon_nullifier_transfer-vkey.json',
        'anon_nullifier_transfer_js/anon_nullifier_transfer.wasm',
        'anon_nullifier_transfer_batch.zkey',
        'anon_nullifier_transfer_batch-vkey.json',
        'anon_nullifier_transfer_batch_js/anon_nullifier_transfer_batch.wasm',
        // anon_nullifier_kyc
        'anon_nullifier_kyc_transfer.zkey',
        'anon_nullifier_kyc_transfer-vkey.json',
        'anon_nullifier_kyc_transfer_js/anon_nullifier_kyc_transfer.wasm',
        'anon_nullifier_kyc_transfer_batch.zkey',
        'anon_nullifier_kyc_transfer_batch-vkey.json',
        'anon_nullifier_kyc_transfer_batch_js/anon_nullifier_kyc_transfer_batch.wasm',
        // deposit
        'deposit.zkey',
        'deposit-vkey.json',
        'deposit_js/deposit.wasm',
        // withdraw
        'withdraw.zkey',
        'withdraw-vkey.json',
        'withdraw_js/withdraw.wasm',
        'withdraw_batch.zkey',
        'withdraw_batch-vkey.json',
        'withdraw_batch_js/withdraw_batch.wasm',
        // withdraw_nullifier
        'withdraw_nullifier.zkey',
        'withdraw_nullifier-vkey.json',
        'withdraw_nullifier_js/withdraw_nullifier.wasm',
        'withdraw_nullifier_batch.zkey',
        'withdraw_nullifier_batch-vkey.json',
        'withdraw_nullifier_batch_js/withdraw_nullifier_batch.wasm',
    ]

    // Every release generation is shipped, each under its own V<n>/ directory, because circuit names are NOT unique
    // across upstream releases — the KYC family kept its names while the proving keys changed, so a flat layout would
    // silently serve one generation's proving key to the other generation's pool. The prover reads
    // <circuitsDir>/V<n>/... for the pool's generation (ZetoReleaseGeneration.ArtifactDirName()), so a node holding
    // every V<n> directory can serve pools of every generation.
    //
    // Versions resolve lazily: the root script is configured before the :domains:zeto ext block exists.
    from {
        project(':domains:zeto').ext.zetoVersions.collect { variant ->
            fileTree("domains/zeto/zkp/${variant.zkpRoot}") { include zetoCircuitIncludes }
        }
    }

    // A single lazy `from` keeps that laziness, so the generation prefix is applied per file on the way out by
    // matching each source path back to the release tree it came from.
    eachFile { details ->
        def variant = project(':domains:zeto').ext.zetoVersions.find { v ->
            details.file.absolutePath.contains("${File.separator}zkp${File.separator}${v.zkpRoot}${File.separator}")
        }
        if (variant == null) {
            throw new GradleException("cannot map ${details.file} back to a zetoVersions release tree")
        }
        def segments = [project(':domains:zeto').ext.zetoGenerationDirName(variant.id)] + (details.relativePath.segments as List)
        details.relativePath = new RelativePath(true, segments as String[])
    }
    includeEmptyDirs = false

    into zetoZkpDir

    outputs.upToDateWhen { false }

    doLast {
        println "Copied zetoZkp files for all generations to ${zetoZkpDir}"
    }
}

// Root assemble task that depends on subproject's assemble tasks
task assemble {
    assembleSubprojects.each { projectPath ->
        dependsOn "${projectPath}:assemble"
    }
}

assemble.finalizedBy(copyLibraries, copyDomains, copyRegistries, copySigningModules, copyTransports, copyRPCAuth, copyUIFiles, copyZetoZKPFiles)

defaultTasks 'build'

// Clean task to clean all projects
task clean {
    delete "${buildDir}"
}

// Refreshes every go.mod / go.sum in the workspace. All generated Go must exist first,
// otherwise `go mod tidy` cannot resolve the packages that import it.
task goModTidy(type: Exec, dependsOn: [
        ':toolkit:go:protoc',
        ':core:go:protoc',
        ':core:go:makeMocks',
        ':transports:grpc:protoc',
        ':domains:zeto:protoc',
    ]) {
    group = 'build'
    description = 'Runs go work sync, then go mod tidy and go mod download across every module in go.work'

    workingDir projectDir
    executable 'bash'
    args "${projectDir}/scripts/tidy-go-mods.sh"

    // The outputs are the go.mod/go.sum files, which are inputs to nearly every other task,
    // so they cannot be declared without creating cycles. Always run when asked.
    outputs.upToDateWhen { false }
}

task docker(type: Exec) {
    executable 'docker'
    args 'build'
    args '-t', 'paladin:test'
    args '.'
}

task dockerx(type: Exec) {
    executable 'docker'
    args 'buildx', 'build'
    args '--platform', 'linux/amd64,linux/arm64'
    args '-t', 'paladin:test'
    args '.'
}
