# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/" # workflows under .github/workflows
      - "/.github/actions/setup"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "gomod"
    directories:
      - "/common/go"
      - "/config"
      - "/core/go"
      - "/domains/integration-test"
      - "/domains/noto"
      - "/domains/zeto"
      - "/operator"
      - "/registries/evm"
      - "/registries/static"
      - "/rpcauth/basicauth"
      - "/sdk/go"
      - "/signingmodules/example"
      - "/test"
      - "/testinfra"
      - "/toolkit/go"
      - "/transports/grpc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/domains/zeto/tools/solidity"
      - "/examples/*"
      - "/sdk/typescript"
      - "/solidity"
      - "/ui/client"
      - "/ui/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/doc-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      pip:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/doc-site/.devcontainer"
      - "/operator"
      - "/test"
      - "/testinfra/besu_bootstrap"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
