# Runs the manual install from operator/README.md on a GitHub-hosted runner.
# Each run rebuilds the Paladin and operator images, installs into Kind,
# and checks that the operator and sample nodes come up.
#
# No pull request: commit this file and push a branch named
# `operator-install/<topic>` (or `fix-paladinNode-creation-error`).
# That push runs the install. A later push to the same branch cancels
# the in-progress run and starts a new one.
#
# From a pull request: add the `operator-install` label. Later pushes rebuild.
#
# After this file is on the default branch, you can also start a one-off run:
# `gh workflow run operator-manual-install.yaml --ref <branch>`
name: Operator manual install

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - fix-paladinNode-creation-error
      - operator-install/**
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-install:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'operator-install')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLUSTER_NAME: paladin
      NAMESPACE: paladin
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space on runner
        uses: ./.github/actions/free-up-disk-space

      - name: Install pre-requisites
        uses: ./.github/actions/setup

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          ignore_failed_clean: true

      # operator/README.md step 1
      - name: Build the Paladin and operator images
        run: ../gradlew --no-daemon buildPaladinImage buildOperatorImage

      # config/samples lists generated smart-contract CRs that are not checked in.
      # Generate them before the Gradle cache is deleted.
      - name: Generate smart contract deployment samples
        run: ../gradlew --no-daemon :operator:buildContractSamples

      # The image build leaves Gradle and BuildKit caches that Kind cannot spare.
      - name: Drop build caches before starting Kind
        working-directory: .
        run: |
          docker builder prune -af
          rm -rf "${HOME}/.gradle/caches" "${HOME}/.gradle/daemon"
          df -h

      # operator/README.md steps 2-3
      - name: Start Kind and load images
        run: |
          make kind-start CLUSTER_NAME="${CLUSTER_NAME}"
          make kind-promote CLUSTER_NAME="${CLUSTER_NAME}"
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

      # operator/README.md steps 4-5. cert-manager is installed by helm-install
      # and must be ready before the sample issuer is applied.
      - name: Install CRDs and the operator
        run: |
          make install-crds
          make helm-install NAMESPACE="${NAMESPACE}"
          kubectl wait --for=condition=Ready pods --all -n cert-manager --timeout=300s
          kubectl rollout status deployment/paladin-operator -n "${NAMESPACE}" --timeout=300s

      # operator/README.md step 6
      - name: Verify the operator is running
        run: kubectl get pods -n "${NAMESPACE}" -o wide

      # operator/README.md steps 7-8. create-node waits for node1 to reach Completed.
      - name: Create Paladin nodes and verify they are running
        run: |
          make create-node NAMESPACE="${NAMESPACE}"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            kubectl get pods -n "${NAMESPACE}" -o wide
            pending=$(kubectl get pods -n "${NAMESPACE}" --no-headers 2>/dev/null | awk '$3 ~ /Error|Crash|ImagePull|ErrImage|Pending|ContainerCreating|Init|PodInitializing|Unknown/ {print}' || true)
            unready=$(kubectl get pods -n "${NAMESPACE}" --no-headers 2>/dev/null | awk '$2 !~ /^([0-9]+)\/\1$/ && $3 != "Completed" && $3 != "Succeeded" {print}' || true)
            if [ -z "${pending}" ] && [ -z "${unready}" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Pods in ${NAMESPACE} did not become ready in time"
          kubectl get pods -n "${NAMESPACE}" -o wide
          exit 1

      - name: Print disk usage
        if: always()
        uses: ./.github/actions/print-disk-usage

      - name: Save cluster logs
        if: failure()
        working-directory: .
        run: |
          mkdir -p cluster-logs
          kubectl get pods -n "${NAMESPACE}" -o wide > cluster-logs/pods.txt || true
          kubectl get all,reg,scd,txn,paladin,besu -n "${NAMESPACE}" -o wide > cluster-logs/resources.txt || true
          kubectl describe pods -n "${NAMESPACE}" > cluster-logs/describe-pods.txt || true
          kubectl logs deployment/paladin-operator -n "${NAMESPACE}" > cluster-logs/operator.log || true
          for i in 1 2 3; do
            kubectl logs "statefulset/paladin-node${i}" -n "${NAMESPACE}" > "cluster-logs/paladin-node${i}.log" || true
            kubectl logs "statefulset/besu-node${i}" -n "${NAMESPACE}" > "cluster-logs/besu-node${i}.log" || true
          done

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-manual-install-logs
          path: cluster-logs/

      - name: Delete the Kind cluster
        if: always()
        working-directory: .
        run: kind delete cluster --name "${CLUSTER_NAME}" || true
