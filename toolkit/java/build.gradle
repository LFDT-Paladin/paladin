buildscript {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}

plugins {
    id 'java'
    alias(toolkitLibs.plugins.protobuf)
}

group = 'io.kaleido'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

test {
    testLogging {
        showStandardStreams = true
    }
    useJUnitPlatform()
}

configurations {
    // Resolvable configurations
    toolkitProtoDefinitions {
        canBeConsumed = false
        canBeResolved = true
    }
}

tasks.register('collectProtocFiles', Copy) {
    from configurations.toolkitProtoDefinitions.asFileTree
    into "src/main/proto"
}

tasks.register('cleanProto', Delete) {
    delete 'src/main/proto'
}

tasks.named('generateProto') {
    dependsOn 'collectProtocFiles'
}

tasks.named('processProtoResources') {
    dependsOn 'collectProtocFiles'
}

tasks.named('processResources') {
    dependsOn 'generateProto'
}

tasks.named('clean') {
    dependsOn tasks.cleanProto
}

tasks.register("protoc") {
    dependsOn tasks.generateProto
}

dependencies {
    constraints {
        implementation(toolkitLibs.guava) {
            because 'CVE-2026-102554: earlier Guava versions allow a denial of service through deserialization'
        }
    }

    // GRPC and Protobuf dependencies
    implementation toolkitLibs.grpc.protobuf
    implementation toolkitLibs.grpc.services
    implementation toolkitLibs.grpc.stub
    implementation toolkitLibs.grpc.netty

    implementation toolkitLibs.bcprov
    implementation toolkitLibs.netty.all
    implementation toolkitLibs.jackson.dataformat.yaml

    compileOnly coreLibs.log4j.core

    toolkitProtoDefinitions project(path: ":toolkit:proto", configuration: "protoDefinitions")

    implementation toolkitLibs.jna.platform
    implementation toolkitLibs.protobuf.java.util

    compileOnly toolkitLibs.tomcat.annotations.api

    // Test dependencies
    testImplementation project(path: ":solidity", configuration: "compiledContracts")
    testImplementation platform(toolkitLibs.junit.bom)
    testImplementation toolkitLibs.junit.jupiter
    testRuntimeOnly toolkitLibs.junit.platform.launcher
    testImplementation toolkitLibs.jsonassert
    testRuntimeOnly coreLibs.log4j.core
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${toolkitLibs.versions.protobuf.asProvider().get()}" }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${toolkitLibs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

tasks.named('assemble') {
    // this package is not intended to be built independently
    enabled = false
}