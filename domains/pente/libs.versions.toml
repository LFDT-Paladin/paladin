[versions]
besu = "24.5.4"
commons-io = "2.16.1"
grpc = "1.69.1"
guava = "33.8.0-jre"
jackson = "2.18.9"
jsonassert = "1.5.3"
junit = "5.9.3"
mockito = "5.12.0"
netty = "4.1.140.Final"
protobuf = "4.29.6"
shadow = "8.3.9"
slf4j = "2.0.20"
tuweni = "2.4.2"
web3j = "4.14.0"

[libraries]
besu-datatypes = { module = "org.hyperledger.besu:besu-datatypes", version.ref = "besu" }
besu-evm = { module = "org.hyperledger.besu:evm", version.ref = "besu" }
besu-trie = { module = "org.hyperledger.besu.internal:trie", version.ref = "besu" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
