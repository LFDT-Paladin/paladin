import org.gradle.api.file.RelativePath

plugins {
    id "de.undercouch.download" version "5.6.0"
}

ext {
    goFiles = fileTree(".") {
        include "internal/**/*.go"
        include "pkg/**/*.go"
    }
    goFilesE2E = fileTree(".") {
        include "integration-test/**/*.go"
    }
    targetCoverage = 92.3
    maxCoverageBarGap = 1
    coveragePackages = [
        "github.com/LFDT-Paladin/paladin/domains/zeto/internal/...",
        "github.com/LFDT-Paladin/paladin/domains/zeto/pkg/types/states.go",
        "github.com/LFDT-Paladin/paladin/domains/zeto/pkg/zetosigner",
    ]

    zkpOut = "${projectDir}/zkp"
    toolsOut = "${projectDir}/tools"

    // Each zeto release version: wasm + test proving keys + contracts downloaded into tools/ (distinct archiveFile names),
    // merged extract under ${zkpOut}/${zkpRoot}. Entry order carries no meaning; the roles below are selected by id.
    //
    // copyRenamedAbiArtifacts: LFDT-style artifacts layout → flattened *_V1 JSON under internal/zeto/abis and pkg/types/abis.
    // The hyperledger-labs v0.2.x layout uses legacy snake_case paths; copySolidity reads those directly from the
    // extracted tree (no renamed ABI task).
    zetoVersions = [
        [
            id                     : 'v0_2_2',
            generation             : 0,
            zkpRoot                : 'v0.2.2',
            wasmUrl                : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.2.2/zeto-wasm-v0.2.2.tar.gz',
            wasmFile               : 'zeto-wasm-v0.2.2.tar.gz',
            provingKeysUrl         : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.2.2/zeto-test-proving-keys-v0.2.2.tar.gz',
            provingKeysFile        : 'zeto-test-proving-keys-v0.2.2.tar.gz',
            contractsUrl           : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.2.2/zeto-contracts-v0.2.2.tar.gz',
            contractsFile          : 'zeto-contracts-v0.2.2.tar.gz',
            copyRenamedAbiArtifacts: false,
        ],
        [
            id                     : 'v0_5_1',
            generation             : 1,
            zkpRoot                : 'v0.5.1',
            wasmUrl                : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.5.1/zeto-wasm.tar.gz',
            wasmFile               : 'zeto-wasm-v0.5.1-lfdt.tar.gz',
            provingKeysUrl         : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.5.1/zeto-test-proving-keys.tar.gz',
            provingKeysFile        : 'zeto-test-proving-keys-v0.5.1-lfdt.tar.gz',
            contractsUrl           : 'https://github.com/LFDT-Paladin/zeto/releases/download/v0.5.1/zeto-contracts.tar.gz',
            contractsFile          : 'zeto-contracts-v0.5.1-lfdt.tar.gz',
            outputSuffix           : '_V1',
            copyRenamedAbiArtifacts: true,
        ],
    ]

    // generation is the Paladin-side ZetoReleaseGeneration ordinal for this release. It is the Gradle half of the
    // mapping documented in domains/zeto/pkg/types/versions.go (V0 -> ~v0.2.x, V1 -> ~v0.5.x) and names the artifact
    // subdirectory the prover reads from, so the two must be kept in step.
    zetoVersionById = { String id ->
        def v = zetoVersions.find { it.id == id }
        if (v == null) {
            throw new GradleException("no zetoVersions entry with id '${id}'")
        }
        return v
    }

    // The primary (default) zeto release. Its extracted zkp tree supplies the proving keys / wasm circuits baked into
    // the Paladin base image (root build.gradle copyZetoZKPFiles), SampleERC20 for the examples and the integration
    // tests, and zetoPrimaryArtifacts.
    zetoPrimaryVersionId = 'v0_5_1'
    zetoPrimaryZkpRoot = zetoVersionById(zetoPrimaryVersionId).zkpRoot
    // Same as zetoPrimaryZkpRoot; kept for root build.gradle / examples that key paths by release tag.
    zetoVersion = zetoPrimaryZkpRoot

    // Source of the V0 internal/zeto/abis/IZeto*_V0.json target-core ABIs (the release-generation axis in
    // domains/zeto/pkg/types/versions.go). Pinned independently of the primary version and NOT movable to v0.5.x:
    //  - these describe the ~v0.2.x on-chain generation, and pools already deployed from it emit those event shapes;
    //  - v0.5.x renamed or removed the artifacts copySolidity reads (izeto_lockable.sol and the *_initializable.sol
    //    interfaces no longer exist), so the v0.5.x equivalents are copied separately as *_V1 by copyZetoSolidityAbi_*.
    // zetoGenerationDirName maps a variant id to its per-generation artifact directory ("V0", "V1"), matching
    // ZetoReleaseGeneration.ArtifactDirName() in Go.
    zetoGenerationDirName = { String id -> "V${zetoVersionById(id).generation}" }

    zetoTargetAbiV0VersionId = 'v0_2_2'
    zetoTargetAbiV0Root = "${zkpOut}/${zetoVersionById(zetoTargetAbiV0VersionId).zkpRoot}"

    // Consumable configuration name for a release tree under zkp/<zkpRoot>/ (e.g. zetoArtifacts_v0_2_2).
    zetoArtifactConfigurationName = { String zkpRoot -> "zetoArtifacts_${zkpRoot.replace('.', '_')}" }
}

configurations {
    // Resolvable configurations
    contractCompile {
        canBeConsumed = false
        canBeResolved = true
    }
    toolkitGo {
        canBeConsumed = false
        canBeResolved = true
    }
    coreGo {
        canBeConsumed = false
        canBeResolved = true
    }

    // Consumable configurations
    goSource {
        canBeConsumed = true
        canBeResolved = false
    }
    zetoArtifacts {
        canBeConsumed = true
        canBeResolved = false
    }
    // Primary release only (default for operator e2e ABI copy); same layout as zetoArtifacts_<tag>.
    zetoPrimaryArtifacts {
        canBeConsumed = true
        canBeResolved = false
    }
    poseidonArtifacts {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    contractCompile project(path: ":solidity", configuration: "compiledContracts")
    toolkitGo project(path: ":toolkit:go", configuration: "goSource")
    coreGo project(path: ":core:go", configuration: "goSource")
}

zetoVersions.each { variant ->
    task "downloadZetoWasm_${variant.id}"(type: Download) {
        src variant.wasmUrl
        dest new File(toolsOut, variant.wasmFile)
        overwrite false
        onlyIfModified true
    }
    task "downloadZetoProvingKeys_${variant.id}"(type: Download) {
        src variant.provingKeysUrl
        dest new File(toolsOut, variant.provingKeysFile)
        overwrite false
        onlyIfModified true
    }
    task "downloadZetoContracts_${variant.id}"(type: Download) {
        src variant.contractsUrl
        dest new File(toolsOut, variant.contractsFile)
        overwrite false
        onlyIfModified true
    }
}

task installPoseidonDependencies(type: Exec) {
    outputs.dir("${toolsOut}/solidity")

    workingDir "${toolsOut}/solidity"
    executable "npm"
    args "install"
    args "circomlibjs@0.1.7"
}

task protoc(type: ProtoCompile, dependsOn: [
        ":toolkit:go:protoc",
    ]) {
    protocPath "bin"
    protoPath projectDir
    protoFiles fileTree("pkg/proto") {
        include "**/*.proto"
    }
    plugins {
        go {
            out projectDir
        }
        go_grpc {
            out projectDir
        }
    }
}

// Per-release exports for consumers that target one zkp/<tag>/ tree (operator, etc.).
zetoVersions.each { variant ->
    configurations.create(zetoArtifactConfigurationName(variant.zkpRoot)) {
        canBeConsumed = true
        canBeResolved = false
    }
}

zetoVersions.each { variant ->
    task "extractZetoZkp_${variant.id}"(type: Copy, dependsOn: [protoc]) {
        dependsOn tasks.getByName("downloadZetoWasm_${variant.id}")
        dependsOn tasks.getByName("downloadZetoProvingKeys_${variant.id}")
        dependsOn tasks.getByName("downloadZetoContracts_${variant.id}")

        from tarTree("${toolsOut}/${variant.wasmFile}")
        from tarTree("${toolsOut}/${variant.provingKeysFile}")
        from tarTree("${toolsOut}/${variant.contractsFile}")
        into "${zkpOut}/${variant.zkpRoot}"
    }
}

task copyPoseidonBuildScript(type: Copy, dependsOn: protoc) {
    from file("${projectDir}/scripts/build-poseidon.js")
    into "${toolsOut}/solidity"
}

task generatePoseidonArtifacts(type: Exec, dependsOn: [installPoseidonDependencies, copyPoseidonBuildScript]) {
    inputs.files(fileTree("${toolsOut}/solidity/node_modules/circomlibjs"))
    outputs.dir("${toolsOut}/solidity")

    workingDir "${toolsOut}/solidity"
    executable "node"
    args "build-poseidon.js"
}

task extractZetoPrimaryZkp {
    dependsOn tasks.getByName("extractZetoZkp_${zetoPrimaryVersionId}")
}

// The target-core interface ABIs below are the V0 generation, so this reads the zetoTargetAbiV0VersionId tree rather
// than the primary one — see the ext block for why the two are pinned separately.
task copySolidity(type: Copy, dependsOn: [protoc, ":solidity:compile", "extractZetoZkp_${zetoTargetAbiV0VersionId}"]) {
    inputs.files(configurations.contractCompile)
    from fileTree(configurations.contractCompile.asPath) {
        include 'contracts/domains/zeto/ZetoFactory_V0.sol/ZetoFactory_V0.json'
    }
    from fileTree("${zetoTargetAbiV0Root}/artifacts/contracts") {
        include 'lib/interfaces/izeto.sol/IZeto.json'
        include 'lib/interfaces/izeto_kyc.sol/IZetoKyc.json'
        include 'lib/interfaces/izeto_lockable.sol/IZetoLockable.json'
    }
    into 'internal/zeto/abis'

    // Flatten, and stamp the generation onto the upstream target-core ABIs. Upstream file names carry no generation,
    // so the suffix is added here; IZetoLockable is the V0 spelling of the role that v0.5.x renamed to
    // ILockableCapability, and copyZetoSolidityAbi_* maps that one onto IZetoLockable_V1.json.
    eachFile { details ->
        switch (details.name) {
            case 'IZeto.json':
            case 'IZetoKyc.json':
            case 'IZetoLockable.json':
                details.relativePath = new RelativePath(true, details.name.replace('.json', '_V0.json'))
                break
            default:
                details.relativePath = new RelativePath(true, details.name)
        }
    }
    includeEmptyDirs = false
}

// Paladin ZetoFactory_V0 wrapper (go:embed factoryabis/ZetoFactory_V0.json); not checked into git.
task copyFactoryAbis(type: Copy, dependsOn: [":solidity:compile"]) {
    inputs.files(configurations.contractCompile)
    from fileTree(configurations.contractCompile.asPath) {
        include 'contracts/domains/zeto/ZetoFactory_V0.sol/ZetoFactory_V0.json'
    }
    into 'internal/zeto/factoryabis'
    eachFile { path = name }
    includeEmptyDirs = false
}

// ABI JSON from release layouts that differ from primary (e.g. LFDT v0.5.x): flattened JSON with outputSuffix for Go embeds.
zetoVersions.findAll { it.copyRenamedAbiArtifacts }.each { variant ->
    task "copyZetoSolidityAbi_${variant.id}"(type: Copy, dependsOn: [protoc]) {
        dependsOn tasks.getByName("downloadZetoContracts_${variant.id}")
        duplicatesStrategy = DuplicatesStrategy.FAIL
        into "${projectDir}/internal/zeto/abis"
        includeEmptyDirs = false
        def suf = variant.outputSuffix

        from(tarTree("${toolsOut}/${variant.contractsFile}")) {
            include 'artifacts/contracts/lib/interfaces/IZeto.sol/IZeto.json'
            include 'artifacts/contracts/lib/interfaces/IZetoKyc.sol/IZetoKyc.json'
            include 'artifacts/contracts/lib/interfaces/IZetoLockable.sol/IZetoLockable.json'
            include 'artifacts/contracts/lib/interfaces/IZetoLockableCapability.sol/IZetoLockableCapability.json'
        }
        eachFile { details ->
            switch (details.name) {
                case 'IZeto.json':
                    details.relativePath = new RelativePath(true, "IZeto${suf}.json")
                    break
                case 'IZetoKyc.json':
                    details.relativePath = new RelativePath(true, "IZetoKyc${suf}.json")
                    break
                case 'IZetoLockable.json':
                case 'IZetoLockableCapability.json':
                    // Both spellings of the same role across releases collapse onto one Paladin-side name so that
                    // IZetoLockable_V0.json / IZetoLockable_V1.json form a matching pair.
                    details.relativePath = new RelativePath(true, "IZetoLockable${suf}.json")
                    break
                default:
                    throw new GradleException("Unexpected file in zeto Solidity ABI copy: ${details.name}")
            }
        }
    }
}

task copyZetoSolidityAbis {
    dependsOn zetoVersions.findAll { it.copyRenamedAbiArtifacts }.collect { tasks.getByName("copyZetoSolidityAbi_${it.id}") }
}

task extractZetoZkpVariants {
    dependsOn zetoVersions.collect { tasks.getByName("extractZetoZkp_${it.id}") }
}

task copyPkgSolidity(type: Copy) {
    inputs.files(configurations.contractCompile)

    into 'pkg/types/abis'
    from fileTree(configurations.contractCompile.asPath) {
        include 'contracts/domains/interfaces/IZetoFungible_V0.sol/IZetoFungible_V0.json'
        include 'contracts/domains/interfaces/IZetoFungible_V1.sol/IZetoFungible_V1.json'
        include 'contracts/domains/interfaces/IZetoNonFungible_V0.sol/IZetoNonFungible_V0.json'
    }

    // Flatten all paths into the destination folder
    eachFile { path = name }
    includeEmptyDirs = false
}

task unitTests(type: Exec, dependsOn: [
        protoc,
        ":core:go:makeMocks",
        extractZetoZkpVariants,
        copySolidity,
        copyFactoryAbis,
        copyZetoSolidityAbis,
        copyPkgSolidity,
        ":domains:integration-test:copySolidity" // TODO: find a better way to share this
    ]) {
    inputs.files(configurations.toolkitGo)
    inputs.files(configurations.coreGo)
    inputs.files(goFiles)
    outputs.dir('coverage')

    def packages = project.properties["coveragePackages"].join(",")

    workingDir '.'
    executable 'go'
    args 'test'
    args './internal/...'
    args './pkg/...'
    args '-cover'
    args '-covermode=atomic'
    args '-timeout=30s'
    args "-coverpkg=${packages}"
    args '-coverprofile=coverage.txt'
    if (project.findProperty('verboseTests') == 'true') {
        args '-v'
    }
}

task checkCoverage(type: GoCheckCoverage, dependsOn: [unitTests]) {
    coverageFile('coverage.txt')
    target = targetCoverage
    maxGap = maxCoverageBarGap
}

task test {
    finalizedBy checkCoverage
}

task buildGo(type: GoLib, dependsOn: [
        ":toolkit:go:protoc",
        copySolidity,
        copyFactoryAbis,
        copyZetoSolidityAbis,
        copyPkgSolidity,
        // copyZetoPkgSolidityAbis,
    ]) {
    inputs.files(configurations.coreGo)
    inputs.files(configurations.toolkitGo)
    baseName "zeto"
    sources goFiles
    mainFile 'zeto.go'
}

task build {
    dependsOn test
}

task clean(type: Delete) {
    delete 'coverage'
    delete 'internal/zeto/abis'
    delete 'internal/zeto/factoryabis'
    delete 'pkg/types/abis'
    delete fileTree(".") {
        include "**/*.pb.go"
    }
    delete zkpOut
    delete toolsOut
}

task assemble {
    dependsOn buildGo
}

dependencies {
    goSource files(goFiles, copySolidity, copyFactoryAbis, copyZetoSolidityAbis, copyPkgSolidity)
    // All release trees (e.g. sdk/typescript). Each root is zkp/<tag>/ — use includes like artifacts/contracts/**/*.json.
    zetoArtifacts files(zetoVersions.collect { tasks.named("extractZetoZkp_${it.id}") })
    // Primary release only.
    zetoPrimaryArtifacts files(tasks.named("extractZetoZkp_${zetoPrimaryVersionId}"))
    zetoVersions.each { variant ->
        add(zetoArtifactConfigurationName(variant.zkpRoot), files(tasks.named("extractZetoZkp_${variant.id}")))
    }
    poseidonArtifacts files(generatePoseidonArtifacts)
}
